services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: kr2-app:1.0
    user: "app:app"
    environment:
      REDIS_HOST: redis
      REDIS_PASSWORD: "${REDIS_PASSWORD:?REDIS_PASSWORD is not set}"
      STUDENT: "${STUDENT:-unknown}"
    depends_on:
      redis:
        condition: service_healthy
    ports:
      - "127.0.0.1:8002:8002"
    networks:
      - backend
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    user: redis
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --requirepass
      - "${REDIS_PASSWORD:?REDIS_PASSWORD is not set}"
    environment:
      REDIS_PASSWORD: "${REDIS_PASSWORD:?REDIS_PASSWORD is not set}"
    volumes:
      - redis_data:/data
    networks:
      - backend
    restart: unless-stopped
    healthcheck:
      test:
        - CMD-SHELL
        - 'redis-cli -a "$$REDIS_PASSWORD" --no-auth-warning ping | grep -q PONG'
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s

networks:
  backend:
    name: backend
    driver: bridge

volumes:
  redis_data:
    name: redis_data
